name: Build Client
on: [push]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        
      - name: Compile C++ Files
        run: |
          cl.exe Loader.cpp /Fe:Loader.exe /O2 /MT
          cl.exe CheatDLL.cpp /Fe:cheat.dll /LD /O2 /MT
          
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: compiled-cheat
          path: |
            Loader.exe
            cheat.dll
